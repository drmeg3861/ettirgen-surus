  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c)));
}
function show(html) { document.open(); document.write(html); document.close(); }
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(P.s), iterations: P.n }, base, 256));
}

(async () => {

  let saved = null; try { saved = localStorage.getItem(K); } catch (e) {}

    show(html);
  });
})();
