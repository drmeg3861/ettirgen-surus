const K = 'ettirgen-surus:key';
const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function decryptHtml(rawKey) {
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c)));
}
function show(html) { document.open(); document.write(html); document.close(); }
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(P.s), iterations: P.n }, base, 256));
}
const msg = t => { document.getElementById('msg').textContent = t; };
(async () => {
  if (!window.crypto || !crypto.subtle) { msg('Bu tarayıcı şifreyi çözemiyor; Chrome ile aç.'); return; }
  let saved = null; try { saved = localStorage.getItem(K); } catch (e) {}
  if (saved) { try { show(await decryptHtml(u8(saved))); return; } catch (e) { try { localStorage.removeItem(K); } catch (e2) {} } }
  const form = document.getElementById('f'), rem = document.getElementById('rem'), go = document.getElementById('go');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const pw = document.getElementById('pw').value; if (!pw) return;
    go.disabled = true; go.textContent = 'Açılıyor…'; msg('');
    let html;
    try { const raw = await derive(pw); html = await decryptHtml(raw); if (rem.checked) { try { localStorage.setItem(K, btoa(String.fromCharCode(...raw))); } catch (e) {} } }
    catch (e) { go.disabled = false; go.textContent = 'Aç'; msg('Şifre yanlış.'); return; }
    show(html);
  });
})();
